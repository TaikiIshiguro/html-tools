<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけで利用できるHTML簡易ツールへのリンク集です。">
  <title>HTML簡易ツール集</title>

  <style>
    /* =========================================================
       基本設定
       デジタル庁デザインシステムを参考に、可読性、十分な余白、
       明確なフォーカス表示、レスポンシブ対応を重視しています。
       ========================================================= */
    :root {
      --color-primary: #0017c1;
      --color-primary-hover: #00118f;
      --color-primary-active: #000b6b;
      --color-text: #1a1a1c;
      --color-text-secondary: #626264;
      --color-background: #ffffff;
      --color-surface: #f7f7f8;
      --color-border: #d8d8db;
      --color-focus: #ffd43b;
      --content-width: 1200px;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--color-text);
      background: var(--color-background);
      font-family: sans-serif;
      font-size: 16px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    a {
      color: inherit;
    }

    /* キーボード操作時に、選択中の要素を明確に示します。 */
    :focus-visible {
      outline: 4px solid var(--color-focus);
      outline-offset: 3px;
    }

    /* 本文へ直接移動するためのスキップリンクです。 */
    .skip-link {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 8px 12px;
      color: #ffffff;
      background: var(--color-primary);
      border-radius: 4px;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .main-content {
      width: min(calc(100% - 48px), var(--content-width));
      margin-inline: auto;
    }

    /* =========================================================
       メインコンテンツ
       ========================================================= */
    .main-content {
      padding-block: clamp(40px, 7vw, 72px) 80px;
    }

    .intro {
      margin-bottom: 40px;
    }

    .intro__heading {
      margin: 0 0 16px;
      font-size: clamp(1.75rem, 1.4rem + 1.5vw, 2.5rem);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .intro__text {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 1rem;
    }

    /* 最大3列。画面幅に応じて2列、1列へ切り替わります。 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .app-grid__item {
      min-width: 0;
    }

    /* カード全体をリンクにし、クリックしやすい領域を確保します。 */
    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 210px;
      padding: 24px;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    .app-card:hover {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .app-card:active {
      border-color: var(--color-primary-active);
      box-shadow: var(--shadow);
      transform: translateY(0);
    }

    .app-card__title {
      margin: 0 0 12px;
      color: var(--color-primary);
      font-size: 1.25rem;
      line-height: 1.5;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .app-card:hover .app-card__title {
      color: var(--color-primary-hover);
      text-decoration-thickness: 2px;
    }

    .app-card__description {
      flex: 1;
      margin: 0;
      color: var(--color-text-secondary);
    }

    .app-card__action {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 8px;
      margin-top: 24px;
      color: var(--color-primary);
      font-weight: 700;
    }

    .app-card__arrow {
      display: inline-block;
      font-size: 1.2em;
      line-height: 1;
      transition: transform 0.18s ease;
    }

    .app-card:hover .app-card__arrow {
      transform: translateX(4px);
    }


    /* =========================================================
       レスポンシブ対応
       ========================================================= */
    @media (max-width: 900px) {
      .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .main-content {
        width: min(calc(100% - 32px), var(--content-width));
      }

      .main-content {
        padding-block: 32px 56px;
      }

      .intro {
        margin-bottom: 32px;
      }

      .app-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .app-card {
        min-height: 0;
        padding: 20px;
      }
    }

    /* 動きを抑制するOS設定を尊重します。 */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 印刷時は影や動きを取り除きます。 */
    @media print {
      .app-card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>


  <main id="main-content" class="main-content">
    <section aria-labelledby="page-heading">
      <div class="intro">
        <h1 id="page-heading" class="intro__heading">HTML簡易ツール集</h1>
        <p class="intro__text">
          目的に合ったツールを選択してください。各ツールは単一HTMLで作成（CSS・JavaScriptはHTML内に記載）されているため、HTMLファイルのみをダウンロードして動かすこともできます。
        </p>
        <p class="intro__text">
          データは外部に送信されませんが、ライブラリをCDNから取得するための通信が発生するものがあります。
        </p>
      </div>

      <!-- JavaScriptで下の配列からカードを生成します。 -->
      <ul id="app-grid" class="app-grid" aria-label="利用できるツール"></ul>

      <!-- JavaScriptが無効な場合に表示します。 -->
      <noscript>
        <p>このページのツール一覧を表示するには、JavaScriptを有効にしてください。</p>
      </noscript>
    </section>
  </main>


  <script>
    "use strict";

    /* =========================================================
       アプリ一覧

       カードを追加する場合は、以下の配列に同じ形式で1件追加します。
       fileには ./apps/ 配下のHTMLファイル名だけを指定してください。

       例:
       {
         name: "PDF黒塗りツール",
         description: "PDFを画像化し、非公開部分を黒塗りするツールです。",
         file: "pdf-redaction.html"
       }
       ========================================================= */
    const apps = [
      {
        name: "画像モザイク",
        description: "画像の指定範囲にモザイクをかけるツールです。",
        file: "image_mosaic_tool.html"
      },
      {
        name: "Mermaidビューワー",
        description: "Mermaidの編集・プレビュー・画像ダウンロードができます。",
        file: "mermaid_viewer.html"
      },
      {
        name: "QRコード作成",
        description: "さまざまなQRコードを作成できます。",
        file: "qr_code_generator.html"
      },
      {
        name: "PDF黒塗り",
        description: "情報公開で開示するPDFの非公開情報を黒塗りするツールです。",
        file: "pdf_redaction_rasterizer.html"
      },
      {
        name: "動画・音声プレイヤー",
        description: "ブラウザでの動画・音声再生に、あったら便利な機能をいろいろ追加しました。",
        file: "browser_media_player.html"
      },
    ];

    const appGrid = document.getElementById("app-grid");

    /*
       innerHTMLを使わずDOM APIで生成し、入力値をHTMLとして解釈させません。
       fileはファイル名のみ許可し、意図しないURLへのリンクを防ぎます。
    */
    const safeFileNamePattern = /^[a-zA-Z0-9][a-zA-Z0-9._-]*\.html$/;

    apps.forEach((app) => {
      if (!safeFileNamePattern.test(app.file)) {
        console.warn(`不正なファイル名のためカードを生成しませんでした: ${app.file}`);
        return;
      }

      const item = document.createElement("li");
      item.className = "app-grid__item";

      const link = document.createElement("a");
      link.className = "app-card";
      link.href = `./apps/${app.file}`;

      const title = document.createElement("h2");
      title.className = "app-card__title";
      title.textContent = app.name;

      const description = document.createElement("p");
      description.className = "app-card__description";
      description.textContent = app.description;

      const action = document.createElement("span");
      action.className = "app-card__action";
      action.textContent = "ツールを開く";

      const arrow = document.createElement("span");
      arrow.className = "app-card__arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";

      action.appendChild(arrow);
      link.append(title, description, action);
      item.appendChild(link);
      appGrid.appendChild(item);
    });
  </script>
</body>
</html>
